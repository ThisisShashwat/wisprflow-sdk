[project]
name = "wisprflow-sdk"
version = "0.1.0"
description = "Unofficial Python SDK for Wispr Flow — transcription and command APIs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["wispr", "transcription", "speech-to-text", "grpc", "asr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "grpcio",
    "requests",
]

[project.scripts]
wisprflow = "wisprflow_sdk._core:main"
wisprflow-patch = "wisprflow_sdk._installer:run_patch"

[project.urls]
Repository = "https://github.com/ThisisShashwat/wisprflow-sdk"

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"